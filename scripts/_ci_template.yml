name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install the light dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml "numpy>=1.26,<2.0" "pandas>=2.2,<3.0" \
                      "pandera>=0.20" opencv-python-headless
      - name: unit tests
        env:
          PYTHONPATH: src
        run: pytest tests -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: build the api image
        run: docker build -f docker/Dockerfile.api -t nastaliq-api:${{ github.sha }} .

      # phase 2 adds the push to ECR and the deploy to EC2 here, gated on the
      # promotion job passing. kept as a comment so the pipeline stays green
      # while the aws account is not wired up yet.
      #
      # - name: configure aws
      #   uses: aws-actions/configure-aws-credentials@v4
      # - name: push to ecr
      #   run: ...
