# Configs for every stage. dvc repro reads this file, and every script also
# logs these values to mlflow so a run can be traced back to its config.
#
# The dataset is a hybrid on purpose. Training data is generated locally so
# the labels are perfect and the volume costs nothing, and the frozen golden
# set is real scanned lines streamed from the Hub, so promotion decisions are
# made against real-world images. Train on synthetic, evaluate on real.

synth:
  train_count: 1500          # clean lines, these become train and val
  stream_count: 400          # degraded lines, standing in for live uploads
  clean_severity: 0.15       # noise, blur and skew applied to the training set
  harsh_severity: 0.75       # the stream set is deliberately worse, so the
                             # drift monitor has something genuine to detect
  font_sizes: [28, 34, 40, 48]
  # Optional. Gives more natural sentence structure than the bundled
  # vocabulary. Streamed, so it costs a few hundred kilobytes, and the
  # generator works fine with it set to an empty string.
  text_corpus_repo: "community-datasets/urdu_fake_news"
  text_corpus_column: "news"

data:
  # Tried in order until enough real rows are collected. Dataset repos on the
  # Hub get renamed, gated or emptied, so a list is more durable than one name.
  hf_candidates:
    - "PuristanLabs1/urdu-ocr-1M"
    - "deepcopy/MMU-OCR-21-Urdu-TextLines"
    - "Ali000007/Urdu-Ocr-Dataset"
    - "Khurram123/urdu-poetry-nastaleeq-ocr"
    - "oddadmix/qaari-0.1-ocr-urdu-news-dataset-small"
    - "vettedlance/urdu-nastaliq-1908-eval-sample"
  real_count: 400            # golden set size. streamed, so roughly 20 MB
  allow_synthetic_golden: false   # fail loudly rather than fake the golden set

  image_height: 64
  max_width: 1024
  seed: 42
  splits:
    train: 0.85              # share of the clean synthetic pool
    val: 0.15
    golden: 0.10             # only used if no real data could be fetched
    stream: 0.10             # only used in that same fallback case

model:
  # cxfajar197/urdu-ocr was the first choice but it is a gated repo on the
  # hub and access needs manual approval from its author, which blocks any
  # reproducible run including ci. this one is apache 2.0 and ungated, same
  # VisionEncoderDecoder architecture, fine tuned from trocr-base-printed
  # on printed urdu nastaliq.
  base_checkpoint: "qandeelasim13/urdu-ocr-trocr-si26"
  max_target_length: 96
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    # recent transformers renamed the attention projections in both the
    # vit encoder and the trocr decoder, so "query" and "value" no longer
    # match anything and peft raises NoMatchingPeftModuleError.
    target_modules: ["q_proj", "v_proj"]

train:
  epochs: 3
  batch_size: 8
  learning_rate: 0.00005
  warmup_steps: 100
  fp16: true
  eval_steps: 500

promotion:
  metric: "cer"
  max_cer: 0.30              # a challenger must be at least this good
  min_improvement: 0.01      # and must beat the champion by this much

llm:
  provider: "groq"           # groq | gemini | ollama
  model: "llama-3.3-70b-versatile"
  corrector_prompt: "prompts/corrector_v1.yaml"
  judge_prompt: "prompts/judge_v1.yaml"
  temperature: 0.0

router:
  # below this the small model is not trusted and the LLM corrector is called
  confidence_threshold: 0.72
  # below this nothing is trusted and the line goes to the human review queue
  review_threshold: 0.45
