[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nastaliqops"
version = "0.1.0"
description = "Urdu Nastaliq OCR with an LLM correction agent and a human in the loop"
requires-python = ">=3.10"

# Dependencies are kept in requirements.txt and requirements-local.txt rather
# than here, because the two installs differ: the laptop does not need torch.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
