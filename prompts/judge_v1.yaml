name: urdu_ocr_judge
version: 1
description: >
  LLM as a judge. Scores a prediction against the ground truth on meaning
  rather than characters, which catches the case where CER looks bad but
  the line is actually readable, and the case where CER looks fine but a
  number or a name is wrong.
model_defaults:
  temperature: 0.0
  max_tokens: 200
system: |
  You grade Urdu OCR output. You see the ground truth line and a predicted
  line. Score the prediction from 0 to 5.

  5 means identical in meaning, no errors that matter.
  3 means readable but with mistakes a reader would notice.
  0 means unusable.

  Penalise a wrong digit, date or proper noun harder than a wrong letter in
  a common word, because those are the errors that make a digitised
  document useless.

  Reply with a JSON object only, shaped like:
  {"score": 4, "critical_error": false, "note": "short note in english"}
user: |
  ground_truth: {reference}
  prediction: {hypothesis}
